    <!-- Modal for selecting projects and repositories -->
    <div id="loadPRModal" class="modal-overlay" onclick="closeLoadPRModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Select Projects & Repositories</h3>
                <button class="modal-close" onclick="closeLoadPRModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text"
                       id="modalProjectSearch"
                       class="search-input"
                       placeholder="🔍 Search projects and repositories..."
                       oninput="filterProjectTree()">

                <div class="bulk-actions">
                    <button class="bulk-action-btn" onclick="selectAllProjects()">✓ Select All Projects</button>
                    <button class="bulk-action-btn" onclick="clearAllProjects()">✗ Clear All</button>
                    <button class="bulk-action-btn" onclick="expandAllProjects()">▼ Expand All</button>
                    <button class="bulk-action-btn" onclick="collapseAllProjects()">▶ Collapse All</button>
                </div>

                <div id="projectTree" class="project-tree">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeLoadPRModal()">Cancel</button>
                <button class="btn-primary" onclick="loadDataFromModal()">Load Pull Requests</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/pr-review-timestamps.js"></script>
    <script src="js/pr-list-utils.js"></script>
    <script src="js/pr-list-columns.js"></script>
    <script src="js/pr-list-display.js"></script>
    <script src="js/pr-list-fetch.js"></script>
    <script src="js/pr-list-live-updates.js"></script>
    <script>
        let allProjects = [];
        let allRepos = [];
        let allPRs = [];
        let filteredPRs = [];
        let allAuthors = new Set();
        let allReviewers = new Set();
        let allCommentAuthors = new Set();
        let isRestoringFromURL = false;
        let currentSort = 'id';
        let currentOrder = 'desc';
        let prCommentCounts = {}; // Cache for active comment counts: { prKey: { count: N, lastFetch: timestamp, lastAccess: timestamp } }
        let currentUserId = null; // Populated on DOMContentLoaded
        let allReviewTimestamps = new Map(); // Map<prId(string), Map<threadId(number), timestamp(number)>>
        let prChecks = {}; // Cache for PR checks (statuses, policies, conflicts): { prKey: { data: {...}, lastFetch: timestamp } }
        let prIterationCounts = {}; // Cache for iteration counts: { prKey: { count: N, lastFetch: timestamp } }
        let isFetchingComments = false;
        let loadedRepoKeys = new Map(); // Track loaded repos with timestamps (repoKey -> timestamp)
        let updateTimeInterval = null; // Interval for updating "time ago" display
        let currentPage = 1;
        let itemsPerPage = 50;

        // Live update state (constants and functions in pr-list-live-updates.js)
        let backgroundPollInterval = null;
        let lastUserInteraction = Date.now();
        let lastBackgroundPoll = 0; // Timestamp of last background poll
        let isBackgroundPolling = false;
        let isLoadingAllPRs = false; // True during refreshPRs / initial bulk load; suppresses background poll diff
        let liveUpdatesEnabled = localStorage.getItem('prListLiveUpdates') !== 'false'; // default: true
        let newPRsDetected = [];
        let newFilterMatchesDetected = [];
        let grayedOutPRKeys = new Set(); // Track PRs that no longer match filters

        // Comment fetch state (constants and queue functions in pr-list-fetch.js)
        let commentFetchQueue = [];
        let isFetchingPriorityQueue = false;
        let _bulkCommentFetchInProgress = false;

        // Column state (constants and functions in pr-list-columns.js)
        let columnWidths = { ...DEFAULT_COLUMN_WIDTHS };
        let columnVisibility = Object.fromEntries(Object.keys(COLUMN_LABELS).map(k => [k, true]));

        window.addEventListener('DOMContentLoaded', async () => {
            const config = ADOConfig.get();

            if (!config || !ADOConfig.isValid(config)) {
                ADOUI.showError('results', 'Please configure your Azure DevOps connection in the Settings page.');
                document.getElementById('loadButton').disabled = true;
                return;
            }

            // Load saved column widths and visibility
            loadColumnWidths();
            loadColumnVisibility();

            // Load current user id and all review timestamps (used to mark unread threads)
            Promise.all([
                ADOAPI.getCurrentUser(config).catch(() => null),
                PRReviewTimestamps.loadAllForOrg(config.serverUrl, config.organization).catch(() => new Map())
            ]).then(([user, tsMap]) => {
                currentUserId = user?.id || null;
                allReviewTimestamps = tsMap;
                // Refresh badges for any PRs already fetched
                if (typeof refreshUnreadMailBadges === 'function') refreshUnreadMailBadges();
            });

            await loadProjects();
            await restoreFiltersFromURL();

            // Auto-load PRs if repos are selected from URL
            const selectedRepos = getSelectedRepos();
            if (selectedRepos.length > 0) {
                await loadPRsFromSelection();
            }

            // Initialize user interaction tracking
            initializeUserInteractionTracking();

            // Initialize live updates toggle from saved preference
            initLiveUpdatesToggle();
        });

        // URL parameter helpers
        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                projects: params.get('projects') ? params.get('projects').split(',') : null,
                repos: params.get('repos') ? params.get('repos').split(',') : null,
                status: params.get('status') ? params.get('status').split(',') : null,
                prId: params.get('prId') || null,
                title: params.get('title') || null,
                involvedIn: params.get('involvedIn') || null,
                createdBy: params.get('createdBy') || null,
                assignedTo: params.get('assignedTo') || null,
                commentAuthor: params.get('commentAuthor') || null,
                sort: params.get('sort') || 'id',
                order: params.get('order') || 'desc',
                page: parseInt(params.get('page')) || 1,
                perPage: parseInt(params.get('perPage')) || 50
            };
        }

        function updateURL() {
            if (isRestoringFromURL) return;

            const params = new URLSearchParams();

            // Projects
            const selectedProjects = getSelectedProjects();
            if (selectedProjects.length > 0) {
                params.set('projects', selectedProjects.join(','));
            }

            // Repos (store repo IDs)
            const selectedRepos = getSelectedRepos();
            if (selectedRepos.length > 0) {
                params.set('repos', selectedRepos.map(r => r.id).join(','));
            }

            // Status
            const selectedStatuses = getSelectedStatuses();
            if (selectedStatuses.length > 0) {
                params.set('status', selectedStatuses.join(','));
            } else {
                // If no statuses selected, use "all" to indicate show all
                params.set('status', 'all');
            }

            // PR ID
            const prId = document.getElementById('prIdFilter').value.trim();
            if (prId) {
                params.set('prId', prId);
            }

            // Title
            const title = document.getElementById('titleFilter').value.trim();
            if (title) {
                params.set('title', title);
            }

            // Involved In
            const involvedIn = document.getElementById('involvedInFilter').value.trim();
            if (involvedIn) {
                params.set('involvedIn', involvedIn);
            }

            // Created By
            const createdBy = document.getElementById('createdByFilter').value.trim();
            if (createdBy) {
                params.set('createdBy', createdBy);
            }

            // Assigned To
            const assignedTo = document.getElementById('assignedToFilter').value.trim();
            if (assignedTo) {
                params.set('assignedTo', assignedTo);
            }

            // Comment Author
            const commentAuthor = document.getElementById('commentAuthorFilter').value.trim();
            if (commentAuthor) {
                params.set('commentAuthor', commentAuthor);
            }

            // Sort and Order
            params.set('sort', currentSort);
            params.set('order', currentOrder);

            // Pagination
            params.set('page', currentPage);
            params.set('perPage', itemsPerPage);

            const newURL = params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            history.replaceState(null, '', newURL);
        }

        async function restoreFiltersFromURL() {
            const urlParams = getURLParams();
            isRestoringFromURL = true;

            try {
                // Restore repo selections
                if (urlParams.repos) {
                    urlParams.repos.forEach(repoId => {
                        const checkbox = document.querySelector(`.repo-checkbox[data-repo-id="${repoId}"]`);
                        if (checkbox) {
                            checkbox.checked = true;
                            // Update parent project state
                            const projectItem = checkbox.closest('.project-item');
                            if (projectItem) {
                                const projectId = projectItem.querySelector('.project-header').onclick.toString().match(/'([^']+)'/)[1];
                                updateProjectState(projectId);
                                // Auto-expand projects with selected repos
                                toggleProject(projectId, true);
                            }
                        }
                    });
                }

                // Restore status selections (if provided in URL, override defaults)
                if (urlParams.status) {
                    // First uncheck all
                    ['active', 'completed', 'abandoned'].forEach(status => {
                        const checkbox = document.querySelector(`input[type="checkbox"][value="${status}"]`);
                        if (checkbox) {
                            checkbox.checked = false;
                        }
                    });
                    // If status is "all", leave all unchecked
                    if (urlParams.status.length === 1 && urlParams.status[0] === 'all') {
                        // All unchecked means show all
                    } else {
                        // Then check only URL-specified statuses
                        urlParams.status.forEach(status => {
                            const checkbox = document.querySelector(`input[type="checkbox"][value="${status}"]`);
                            if (checkbox) {
                                checkbox.checked = true;
                            }
                        });
                    }
                }

                // Restore text filters
                if (urlParams.prId) {
                    document.getElementById('prIdFilter').value = urlParams.prId;
                }
                if (urlParams.title) {
                    document.getElementById('titleFilter').value = urlParams.title;
                }
                if (urlParams.involvedIn) {
                    document.getElementById('involvedInFilter').value = urlParams.involvedIn;
                }
                if (urlParams.createdBy) {
                    document.getElementById('createdByFilter').value = urlParams.createdBy;
                }
                if (urlParams.assignedTo) {
                    document.getElementById('assignedToFilter').value = urlParams.assignedTo;
                }
                if (urlParams.commentAuthor) {
                    document.getElementById('commentAuthorFilter').value = urlParams.commentAuthor;
                }

                // Restore sort and order
                currentSort = urlParams.sort;
                currentOrder = urlParams.order;

                // Restore pagination
                currentPage = urlParams.page;
                itemsPerPage = urlParams.perPage;

            } finally {
                isRestoringFromURL = false;
            }
        }

        async function loadProjects() {
            const config = ADOConfig.get();
            const projectTreeDiv = document.getElementById('projectTree');

            try {
                ADOUI.showLoading('projectTree', 'Loading projects...');

                const projectsData = await ADOAPI.getProjects(config);
                allProjects = projectsData.value || [];

                if (allProjects.length === 0) {
                    projectTreeDiv.innerHTML = '<div class="no-results">No projects found</div>';
                    return;
                }

                // Load repos for all projects in parallel
                const repoPromises = allProjects.map(project =>
                    ADOAPI.getRepositories(config, project.name)
                        .then(data => ({
                            project: project.name,
                            repos: data.value || []
                        }))
                        .catch(() => ({
                            project: project.name,
                            repos: []
                        }))
                );

                const reposResults = await Promise.all(repoPromises);

                // Build project-repo map
                const projectRepoMap = {};
                reposResults.forEach(result => {
                    projectRepoMap[result.project] = result.repos;
                });

                // Build tree HTML
                buildProjectTree(projectRepoMap, config);

            } catch (error) {
                projectTreeDiv.innerHTML = `<div class="error">Error: ${ADOContent.escapeHtml(error.message)}</div>`;
            }
        }

        function buildProjectTree(projectRepoMap, config) {
            const projectTreeDiv = document.getElementById('projectTree');
            let html = '';

            // Check if URL has repos parameter - if so, don't select default repo
            const urlParams = getURLParams();
            const hasUrlRepos = urlParams.repos && urlParams.repos.length > 0;

            allProjects.forEach(project => {
                const repos = projectRepoMap[project.name] || [];
                const isDefaultProject = project.name === config.project;
                const projectId = `project-${project.id}`;

                // Count checked repos (will be updated dynamically)
                const checkedRepos = repos.filter(repo =>
                    repo.name === config.repository && isDefaultProject && !hasUrlRepos
                ).length;

                html += `
                    <div class="project-item" data-project-name="${ADOContent.escapeHtml(project.name)}">
                        <div class="project-header" onclick="toggleProject('${projectId}')">
                            <span class="project-toggle" id="${projectId}-toggle">▶</span>
                            <input type="checkbox"
                                   class="project-checkbox"
                                   id="${projectId}-checkbox"
                                   data-project="${ADOContent.escapeHtml(project.name)}"
                                   onclick="event.stopPropagation(); onProjectCheckboxChange('${projectId}')"
                                   ${isDefaultProject && checkedRepos > 0 ? '' : ''}>
                            <span class="project-name">${ADOContent.escapeHtml(project.name)}</span>
                            <span class="project-count" id="${projectId}-count">(0/${repos.length} repos)</span>
                        </div>
                        <div class="repo-list" id="${projectId}-repos">
                `;

                // Add repositories
                repos.forEach(repo => {
                    const isDefaultRepo = repo.name === config.repository && isDefaultProject && !hasUrlRepos;
                    html += `
                        <div class="repo-item" data-repo-name="${ADOContent.escapeHtml(repo.name)}">
                            <input type="checkbox"
                                   class="repo-checkbox"
                                   data-project="${ADOContent.escapeHtml(project.name)}"
                                   data-repo-id="${ADOContent.escapeHtml(repo.id)}"
                                   data-repo-name="${ADOContent.escapeHtml(repo.name)}"
                                   onclick="onRepoCheckboxChange('${projectId}')"
                                   ${isDefaultRepo ? 'checked' : ''}>
                            <span class="repo-name">${ADOContent.escapeHtml(repo.name)}</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            projectTreeDiv.innerHTML = html;

            // Update all project counts and states
            allProjects.forEach(project => {
                const projectId = `project-${project.id}`;
                updateProjectState(projectId);
            });

            // Auto-expand default project if it has selected repos
            if (config.project) {
                const defaultProject = allProjects.find(p => p.name === config.project);
                if (defaultProject) {
                    const projectId = `project-${defaultProject.id}`;
                    const checkedRepos = document.querySelectorAll(`#${projectId}-repos .repo-checkbox:checked`);
                    if (checkedRepos.length > 0) {
                        toggleProject(projectId, true);
                    }
                }
            }
        }

        // Tree interaction functions
        function toggleProject(projectId, forceExpand = null) {
            const repoList = document.getElementById(`${projectId}-repos`);
            const toggle = document.getElementById(`${projectId}-toggle`);

            if (forceExpand === true) {
                repoList.classList.add('expanded');
                toggle.textContent = '▼';
            } else if (forceExpand === false) {
                repoList.classList.remove('expanded');
                toggle.textContent = '▶';
            } else {
                repoList.classList.toggle('expanded');
                toggle.textContent = repoList.classList.contains('expanded') ? '▼' : '▶';
            }
        }

        function updateProjectState(projectId) {
            const projectCheckbox = document.getElementById(`${projectId}-checkbox`);
            const repoCheckboxes = document.querySelectorAll(`#${projectId}-repos .repo-checkbox`);
            const countSpan = document.getElementById(`${projectId}-count`);

            const checkedCount = Array.from(repoCheckboxes).filter(cb => cb.checked).length;
            const totalCount = repoCheckboxes.length;

            // Update count display
            countSpan.textContent = `(${checkedCount}/${totalCount} repos)`;

            // Update project checkbox state
            if (checkedCount === 0) {
                projectCheckbox.checked = false;
                projectCheckbox.indeterminate = false;
            } else if (checkedCount === totalCount) {
                projectCheckbox.checked = true;
                projectCheckbox.indeterminate = false;
            } else {
                projectCheckbox.checked = true;
                projectCheckbox.indeterminate = true;
            }
        }

        function onProjectCheckboxChange(projectId) {
            const projectCheckbox = document.getElementById(`${projectId}-checkbox`);
            const repoCheckboxes = document.querySelectorAll(`#${projectId}-repos .repo-checkbox`);

            // Select/deselect all repos in this project
            repoCheckboxes.forEach(cb => {
                if (!cb.closest('.repo-item').classList.contains('hidden')) {
                    cb.checked = projectCheckbox.checked;
                }
            });

            updateProjectState(projectId);
            updateURL();
            applyFilters();
        }

        function onRepoCheckboxChange(projectId) {
            updateProjectState(projectId);
            updateURL();
            applyFilters();
        }

        // Modal functions
        function openLoadPRModal() {
            document.getElementById('loadPRModal').classList.add('show');
        }

        function closeLoadPRModal(event) {
            // If event is provided, only close if clicking the overlay directly
            if (event && event.target !== event.currentTarget) {
                return;
            }
            document.getElementById('loadPRModal').classList.remove('show');
        }

        // Search filter function
        function filterProjectTree() {
            const searchTerm = ADOSearch.normalize(document.getElementById('modalProjectSearch').value.trim());
            const projectItems = document.querySelectorAll('.project-item');

            if (!searchTerm) {
                // Show all
                projectItems.forEach(projectItem => {
                    projectItem.classList.remove('hidden');
                    const repoItems = projectItem.querySelectorAll('.repo-item');
                    repoItems.forEach(repoItem => repoItem.classList.remove('hidden'));
                });
                return;
            }

            projectItems.forEach(projectItem => {
                const projectName = ADOSearch.normalize(projectItem.dataset.projectName);
                const repoItems = projectItem.querySelectorAll('.repo-item');

                let projectMatch = projectName.includes(searchTerm);
                let hasVisibleRepo = false;

                repoItems.forEach(repoItem => {
                    const repoName = ADOSearch.normalize(repoItem.dataset.repoName);
                    const repoMatch = repoName.includes(searchTerm);

                    if (repoMatch || projectMatch) {
                        repoItem.classList.remove('hidden');
                        hasVisibleRepo = true;
                    } else {
                        repoItem.classList.add('hidden');
                    }
                });

                // Show project if it matches or has visible repos
                if (projectMatch || hasVisibleRepo) {
                    projectItem.classList.remove('hidden');
                    // Auto-expand projects with matches
                    if (searchTerm) {
                        const projectId = projectItem.querySelector('.project-header').onclick.toString().match(/'([^']+)'/)[1];
                        toggleProject(projectId, true);
                    }
                } else {
                    projectItem.classList.add('hidden');
                }
            });
        }

        // Bulk action functions
        function selectAllProjects() {
            const projectCheckboxes = document.querySelectorAll('.project-checkbox');
            projectCheckboxes.forEach(cb => {
                if (!cb.closest('.project-item').classList.contains('hidden')) {
                    cb.checked = true;
                    const projectId = cb.id.replace('-checkbox', '');
                    const repoCheckboxes = document.querySelectorAll(`#${projectId}-repos .repo-checkbox`);
                    repoCheckboxes.forEach(repoCb => {
                        if (!repoCb.closest('.repo-item').classList.contains('hidden')) {
                            repoCb.checked = true;
                        }
                    });
                    updateProjectState(projectId);
                }
            });
            updateURL();
            applyFilters();
        }

        function clearAllProjects() {
            const projectCheckboxes = document.querySelectorAll('.project-checkbox');
            projectCheckboxes.forEach(cb => {
                cb.checked = false;
                const projectId = cb.id.replace('-checkbox', '');
                const repoCheckboxes = document.querySelectorAll(`#${projectId}-repos .repo-checkbox`);
                repoCheckboxes.forEach(repoCb => repoCb.checked = false);
                updateProjectState(projectId);
            });
            updateURL();
            applyFilters();
        }

        function expandAllProjects() {
            const projectItems = document.querySelectorAll('.project-item');
            projectItems.forEach(projectItem => {
                if (!projectItem.classList.contains('hidden')) {
                    const projectId = projectItem.querySelector('.project-header').onclick.toString().match(/'([^']+)'/)[1];
                    toggleProject(projectId, true);
                }
            });
        }

        function collapseAllProjects() {
            const projectItems = document.querySelectorAll('.project-item');
            projectItems.forEach(projectItem => {
                const projectId = projectItem.querySelector('.project-header').onclick.toString().match(/'([^']+)'/)[1];
                toggleProject(projectId, false);
            });
        }

        async function loadDataFromModal() {
            const selectedProjects = getSelectedProjects();
            const selectedRepos = getSelectedRepos();

            if (selectedProjects.length === 0) {
                ADOUI.showError('results', 'Please select at least one project.');
                return;
            }

            if (selectedRepos.length === 0) {
                ADOUI.showError('results', 'Please select at least one repository.');
                return;
            }

            // Close the modal
            closeLoadPRModal();

            await loadPRsFromSelection();
        }

        async function loadPRsFromSelection() {
            const config = ADOConfig.get();
            const selectedRepos = getSelectedRepos();

            if (selectedRepos.length === 0) {
                return;
            }

            // Determine which repos need to be loaded (not already loaded)
            const reposToLoad = [];
            const reposToRemove = [];

            selectedRepos.forEach(repo => {
                const repoKey = `${repo.projectName}/${repo.id}`;
                if (!loadedRepoKeys.has(repoKey)) {
                    reposToLoad.push(repo);
                }
            });

            // Find repos that were previously loaded but are no longer selected
            const selectedRepoKeys = new Set(selectedRepos.map(r => `${r.projectName}/${r.id}`));
            loadedRepoKeys.forEach((timestamp, repoKey) => {
                if (!selectedRepoKeys.has(repoKey)) {
                    reposToRemove.push(repoKey);
                }
            });

            // Remove PRs from deselected repos
            if (reposToRemove.length > 0) {
                allPRs = allPRs.filter(pr => {
                    const prRepoKey = `${pr._project}/${pr._repo.id}`;
                    return !reposToRemove.includes(prRepoKey);
                });

                // Remove from loaded set
                reposToRemove.forEach(key => loadedRepoKeys.delete(key));

                // Rebuild authors/reviewers/comment authors from remaining PRs
                allAuthors = new Set();
                allReviewers = new Set();
                allCommentAuthors = new Set();
                allPRs.forEach(pr => {
                    if (pr.createdBy) {
                        allAuthors.add(pr.createdBy.displayName);
                    }
                    if (pr.reviewers) {
                        pr.reviewers.forEach(reviewer => {
                            allReviewers.add(reviewer.displayName);
                        });
                    }
                    // Rebuild comment authors from cached data
                    const prKey = `${pr._project}/${pr._repo.id}/${pr.pullRequestId}`;
                    const cached = prCommentCounts[prKey];
                    if (cached && cached.authorObjects) {
                        Object.values(cached.authorObjects).forEach(author => {
                            if (author.displayName) {
                                allCommentAuthors.add(author.displayName);
                            }
                        });
                    }
                });
            }

            // If no new repos to load, just apply filters and return
            if (reposToLoad.length === 0) {
                updatePRSourceDisplay();
                applyFilters();
                return;
            }

            const totalRepos = reposToLoad.length;
            let completedRepos = 0;

            function showLoadProgress(repoName) {
                completedRepos++;
                const pct = Math.round(completedRepos / totalRepos * 100);
                const textEl = document.getElementById('loadProgressText');
                const countEl = document.getElementById('loadProgressCount');
                const barEl = document.getElementById('loadProgressBar');
                if (textEl) textEl.textContent = repoName;
                if (countEl) countEl.textContent = `${completedRepos} / ${totalRepos}`;
                if (barEl) barEl.style.width = `${pct}%`;
            }

            document.getElementById('results').innerHTML = `
                <div class="load-progress">
                    <div class="load-progress-inner">
                        <div class="load-progress-label">
                            <span id="loadProgressText">Loading Pull Requests...</span>
                            <span id="loadProgressCount">0 / ${totalRepos}</span>
                        </div>
                        <div class="filter-progress-track">
                            <div id="loadProgressBar" class="filter-progress-bar"></div>
                        </div>
                    </div>
                </div>`;

            try {
                // Load PRs from new repos only
                const prPromises = reposToLoad.map(repo =>
                    ADOAPI.getPRs(config, repo.projectName, repo.name, 'all')
                        .then(data => {
                            showLoadProgress(repo.name);
                            return { repo, prs: data.value || [] };
                        })
                        .catch(error => {
                            showLoadProgress(repo.name);
                            return { repo, prs: [], error: error.message };
                        })
                );

                const prResults = await Promise.all(prPromises);

                // Add new PRs and update author/reviewer lists
                prResults.forEach(result => {
                    if (result.prs.length > 0) {
                        result.prs.forEach(pr => {
                            pr._repo = result.repo;
                            pr._project = result.repo.projectName;
                            allPRs.push(pr);

                            // Collect authors
                            if (pr.createdBy) {
                                allAuthors.add(pr.createdBy.displayName);
                            }

                            // Collect reviewers
                            if (pr.reviewers) {
                                pr.reviewers.forEach(reviewer => {
                                    allReviewers.add(reviewer.displayName);
                                });
                            }
                        });

                        // Mark repo as loaded with current timestamp
                        const repoKey = `${result.repo.projectName}/${result.repo.id}`;
                        loadedRepoKeys.set(repoKey, Date.now());
                    }
                });

                updatePRSourceDisplay();
                applyFilters();

                // Start background polling after successful load
                startBackgroundPolling();

            } catch (error) {
                ADOUI.showError('results', error.message);
            }
        }

        function updatePRSourceDisplay() {
            const selectedRepos = getSelectedRepos();
            const prSourceDisplay = document.getElementById('prSourceDisplay');

            if (selectedRepos.length === 0) {
                prSourceDisplay.classList.remove('show');
                stopUpdateTimeInterval();
                return;
            }

            // Create list of project/repo pairs
            const repoList = selectedRepos
                .map(repo => `${ADOContent.escapeHtml(repo.projectName)}/${ADOContent.escapeHtml(repo.name)}`)
                .join(', ');

            // Find oldest (most stale) timestamp from selected repos
            let oldestTimestamp = null;
            selectedRepos.forEach(repo => {
                const repoKey = `${repo.projectName}/${repo.id}`;
                const timestamp = loadedRepoKeys.get(repoKey);
                if (timestamp) {
                    if (!oldestTimestamp || timestamp < oldestTimestamp) {
                        oldestTimestamp = timestamp;
                    }
                }
            });

            const timeAgo = oldestTimestamp ? getTimeAgo(oldestTimestamp) : '';
            const timeDisplay = timeAgo ? `<span style="color: #605e5c; font-size: 12px; margin-left: 10px;" id="timeAgo">(oldest: ${timeAgo})</span>` : '';
            const refreshButton = oldestTimestamp ? `<button onclick="manualRefresh()" style="margin-right: 10px; padding: 4px 8px; background: white; border: 1px solid #d1d1d1; border-radius: 0; cursor: pointer; font-size: 12px; color: #0078d4;" title="Refresh PRs">↻ Refresh</button>` : '';

            // Count pending changes relevant to current filters
            const filters = getCurrentFilters();
            const newMatchCount = newPRsDetected.filter(pr => prMatchesFilters(pr, filters)).length
                + newFilterMatchesDetected.length;
            const changesCount = newMatchCount + grayedOutPRKeys.size;
            const changesButton = changesCount > 0
                ? `<button onclick="applyLiveUpdates()" style="margin-left: 10px; padding: 4px 8px; background: #0078d4; border: 1px solid #0078d4; border-radius: 0; cursor: pointer; font-size: 12px; color: white;" title="Apply pending changes">Show PR changes (${changesCount})</button>`
                : '';

            prSourceDisplay.innerHTML = `${refreshButton}<strong>Loaded from:</strong> ${repoList}${timeDisplay}${changesButton}`;
            prSourceDisplay.classList.add('show');

            // Start updating time display if not already running
            if (oldestTimestamp && !updateTimeInterval) {
                startUpdateTimeInterval();
            }
        }

        function getTimeAgo(timestamp) {
            return PRListUtils.getTimeAgo(timestamp);
        }

        function startUpdateTimeInterval() {
            // Update time display every 30 seconds
            updateTimeInterval = setInterval(() => {
                const selectedRepos = getSelectedRepos();

                // Find oldest timestamp from selected repos
                let oldestTimestamp = null;
                selectedRepos.forEach(repo => {
                    const repoKey = `${repo.projectName}/${repo.id}`;
                    const timestamp = loadedRepoKeys.get(repoKey);
                    if (timestamp) {
                        if (!oldestTimestamp || timestamp < oldestTimestamp) {
                            oldestTimestamp = timestamp;
                        }
                    }
                });

                if (oldestTimestamp) {
                    const timeAgoElement = document.getElementById('timeAgo');
                    if (timeAgoElement) {
                        timeAgoElement.textContent = `(oldest: ${getTimeAgo(oldestTimestamp)})`;
                    }
                }
            }, 30000);
        }

        function stopUpdateTimeInterval() {
            if (updateTimeInterval) {
                clearInterval(updateTimeInterval);
                updateTimeInterval = null;
            }
        }

        async function refreshPRs() {
            isLoadingAllPRs = true;
            try {
                // Clear cache and reload all selected repos
                loadedRepoKeys.clear();
                prCommentCounts = {};
                allPRs = [];
                allAuthors = new Set();
                allReviewers = new Set();
                allCommentAuthors = new Set();

                // Clear live update state
                grayedOutPRKeys.clear();
                newPRsDetected = [];
                newFilterMatchesDetected = [];

                // Reload review timestamps so mail badges reflect changes from other tabs
                const config = ADOConfig.get();
                try {
                    allReviewTimestamps = await PRReviewTimestamps.loadAllForOrg(config.serverUrl, config.organization);
                } catch (e) { /* non-critical */ }

                await loadPRsFromSelection();
            } finally {
                isLoadingAllPRs = false;
            }
        }

        function getSelectedProjects() {
            const repoCheckboxes = document.querySelectorAll('.repo-checkbox:checked');
            const projects = new Set();
            repoCheckboxes.forEach(cb => {
                projects.add(cb.dataset.project);
            });
            return Array.from(projects);
        }

        function getSelectedRepos() {
            const repoCheckboxes = document.querySelectorAll('.repo-checkbox:checked');
            return Array.from(repoCheckboxes).map(cb => ({
                id: cb.dataset.repoId,
                name: cb.dataset.repoName,
                projectName: cb.dataset.project
            }));
        }

        function getSelectedStatuses() {
            const statuses = ['active', 'completed', 'abandoned'];
            const selected = [];
            statuses.forEach(status => {
                const checkbox = document.querySelector(`input[type="checkbox"][value="${status}"]`);
                if (checkbox && checkbox.checked) {
                    selected.push(status);
                }
            });
            return selected;
        }

        /**
         * Read current filter values from the DOM and return a filters object.
         */
        function getCurrentFilters() {
            return {
                prId: document.getElementById('prIdFilter').value.trim(),
                title: document.getElementById('titleFilter').value.trim(),
                involvedIn: ADOSearch.normalize(document.getElementById('involvedInFilter').value.trim()),
                createdBy: ADOSearch.normalize(document.getElementById('createdByFilter').value.trim()),
                assignedTo: ADOSearch.normalize(document.getElementById('assignedToFilter').value.trim()),
                commentAuthor: ADOSearch.normalize(document.getElementById('commentAuthorFilter').value.trim()),
                statuses: getSelectedStatuses()
            };
        }

        /**
         * Test whether a single PR matches the given filters object.
         */
        function prMatchesFilters(pr, filters) {
            return PRListUtils.prMatchesFilters(pr, filters, {
                normalize: ADOSearch.normalize,
                commentCounts: prCommentCounts
            });
        }

        function applyFilters() {
            // Clear grayed out PRs when filters change
            grayedOutPRKeys.clear();

            const filters = getCurrentFilters();
            filteredPRs = allPRs.filter(pr => prMatchesFilters(pr, filters));

            // Reset to page 1 when filters change
            currentPage = 1;

            displayPRs();
            updateSelectedFilters();
            updateURL();
        }

        function updateSelectedFilters() {
            const selectedFiltersDiv = document.getElementById('selectedFilters');
            const filters = [];

            const prIdFilter = document.getElementById('prIdFilter').value.trim();
            if (prIdFilter) {
                filters.push({ label: `PR ID: ${prIdFilter}`, clear: () => {
                    document.getElementById('prIdFilter').value = '';
                    applyFilters();
                }});
            }

            const titleFilter = document.getElementById('titleFilter').value.trim();
            if (titleFilter) {
                filters.push({ label: `Title: ${titleFilter}`, clear: () => {
                    document.getElementById('titleFilter').value = '';
                    applyFilters();
                }});
            }

            const involvedInFilter = document.getElementById('involvedInFilter').value.trim();
            if (involvedInFilter) {
                const names = involvedInFilter.split(';').map(n => n.trim()).filter(n => n.length > 0);
                names.forEach(name => {
                    filters.push({ label: `Involved: ${name}`, clear: () => {
                        const input = document.getElementById('involvedInFilter');
                        const remaining = input.value.split(';').map(n => n.trim()).filter(n => n.length > 0 && n.toLowerCase() !== name.toLowerCase());
                        input.value = remaining.join('; ');
                        applyFilters();
                    }});
                });
            }

            const createdByFilter = document.getElementById('createdByFilter').value.trim();
            if (createdByFilter) {
                const authors = createdByFilter.split(';').map(a => a.trim()).filter(a => a.length > 0);
                authors.forEach(author => {
                    filters.push({ label: `Created by: ${author}`, clear: () => {
                        const input = document.getElementById('createdByFilter');
                        const remaining = input.value.split(';').map(a => a.trim()).filter(a => a.length > 0 && a.toLowerCase() !== author.toLowerCase());
                        input.value = remaining.join('; ');
                        applyFilters();
                    }});
                });
            }

            const assignedToFilter = document.getElementById('assignedToFilter').value.trim();
            if (assignedToFilter) {
                const reviewers = assignedToFilter.split(';').map(r => r.trim()).filter(r => r.length > 0);
                reviewers.forEach(reviewer => {
                    filters.push({ label: `Assigned to: ${reviewer}`, clear: () => {
                        const input = document.getElementById('assignedToFilter');
                        const remaining = input.value.split(';').map(r => r.trim()).filter(r => r.length > 0 && r.toLowerCase() !== reviewer.toLowerCase());
                        input.value = remaining.join('; ');
                        applyFilters();
                    }});
                });
            }

            const commentAuthorFilter = document.getElementById('commentAuthorFilter').value.trim();
            if (commentAuthorFilter) {
                filters.push({ label: `Comment author: ${commentAuthorFilter}`, clear: () => {
                    document.getElementById('commentAuthorFilter').value = '';
                    applyFilters();
                }});
            }

            if (filters.length === 0) {
                selectedFiltersDiv.innerHTML = '';
                return;
            }

            let html = '';
            filters.forEach((filter, index) => {
                html += `
                    <span class="filter-tag">
                        ${ADOContent.escapeHtml(filter.label)}
                        <button onclick="clearFilter(${index})" title="Remove filter">×</button>
                    </span>
                `;
            });

            selectedFiltersDiv.innerHTML = html;

            // Store filters for clearing
            window._activeFilters = filters;
        }

        function clearFilter(index) {
            if (window._activeFilters && window._activeFilters[index]) {
                window._activeFilters[index].clear();
            }
        }

        // showFilterProgress, updateFilterProgress, hideFilterProgress are in js/pr-list-fetch.js

        function sortPRs(column) {
            // Toggle order if clicking same column, otherwise default to desc
            if (currentSort === column) {
                currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = column;
                currentOrder = 'desc';
            }

            // Reset to page 1 when sorting changes
            currentPage = 1;

            updateURL();
            displayPRs();
        }

        function getAuthorAvatarHtml(author) {
            if (!author) {
                return '<span style="color: #8a8886;">-</span>';
            }

            const initials = author.displayName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            const displayName = ADOContent.escapeHtml(author.displayName);

            let avatarHtml;
            if (author.id) {
                const cachedUrl = AvatarLoader.getCached(author.id);
                if (cachedUrl) {
                    avatarHtml = `<img src="${cachedUrl}" alt="${displayName}" title="${displayName}" class="avatar">`;
                } else {
                    // Show gray placeholder while loading, image fades in on top
                    avatarHtml = `<div class="avatar-placeholder" title="${displayName}"></div><img data-user-id="${author.id}" alt="${displayName}" title="${displayName}" class="avatar avatar-pending">`;
                }
            } else {
                avatarHtml = `<div class="avatar-fallback" title="${displayName}">${initials}</div>`;
            }

            return `<div class="avatar-wrapper">${avatarHtml}</div>`;
        }

        function getReviewerAvatarsHtml(reviewers) {
            if (!reviewers || reviewers.length === 0) {
                return '<span style="color: #8a8886;">-</span>';
            }

            return '<div class="avatars-container">' + reviewers.map(r => {
                const initials = r.displayName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                const displayName = ADOContent.escapeHtml(r.displayName);

                // Get vote status
                const vote = r.vote || 0;
                let statusClass = '';
                let statusText = '';

                switch (vote) {
                    case 10:
                        statusClass = 'status-approved';
                        statusText = 'Approved';
                        break;
                    case 5:
                        statusClass = 'status-approved-suggestions';
                        statusText = 'Approved with suggestions';
                        break;
                    case -5:
                        statusClass = 'status-waiting';
                        statusText = 'Waiting for author';
                        break;
                    case -10:
                        statusClass = 'status-rejected';
                        statusText = 'Rejected';
                        break;
                    default:
                        statusClass = 'status-no-vote';
                        statusText = 'No vote';
                }

                const title = `${displayName} - ${statusText}`;

                let avatarHtml;
                if (r.id) {
                    const cachedUrl = AvatarLoader.getCached(r.id);
                    if (cachedUrl) {
                        avatarHtml = `<img src="${cachedUrl}" data-user-id="${r.id}" alt="${title}" title="${title}" class="avatar">`;
                    } else {
                        // Show gray placeholder while loading, image fades in on top
                        avatarHtml = `<div class="avatar-placeholder" title="${title}"></div><img data-user-id="${r.id}" alt="${title}" title="${title}" class="avatar avatar-pending">`;
                    }
                } else {
                    avatarHtml = `<div class="avatar-fallback" title="${title}">${initials}</div>`;
                }

                // Badge SVG icons for different statuses (no badge for no-vote)
                const svgSize = 11;
                const svgAttrs = `xmlns="http://www.w3.org/2000/svg" width="${svgSize}" height="${svgSize}" viewBox="0 0 16 16" fill="white"`;
                let badgeHtml = '';
                if (vote === 10) {
                    badgeHtml = `<span class="reviewer-status-badge ${statusClass}"><svg ${svgAttrs}><path d="M13.5 2.5l-7.5 9-3.5-3.5-2 2 5.5 5.5 9.5-11.5z"/></svg></span>`;
                } else if (vote === 5) {
                    badgeHtml = `<span class="reviewer-status-badge ${statusClass}"><svg ${svgAttrs}><path d="M9 2h-2v7h2zM9 11h-2v2h2z"/></svg></span>`;
                } else if (vote === -10) {
                    badgeHtml = `<span class="reviewer-status-badge ${statusClass}"><svg ${svgAttrs}><path d="M3 3l10 10M13 3l-10 10" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></span>`;
                } else if (vote === -5) {
                    badgeHtml = `<span class="reviewer-status-badge ${statusClass}"><svg ${svgAttrs}><path d="M8 4v4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M8 8l2.5 3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>`;
                }

                const wrapperId = r.id ? ` data-user-id="${r.id}"` : '';
                return `<div class="avatar-wrapper"${wrapperId}>${avatarHtml}${badgeHtml}</div>`;
            }).join('') + '</div>';
        }

        function getSortedPRs() {
            const sorted = [...filteredPRs];

            sorted.sort((a, b) => {
                let aVal, bVal;

                switch (currentSort) {
                    case 'id':
                        aVal = a.pullRequestId;
                        bVal = b.pullRequestId;
                        break;
                    case 'title':
                        aVal = a.title.toLowerCase();
                        bVal = b.title.toLowerCase();
                        break;
                    case 'author':
                        aVal = a.createdBy.displayName.toLowerCase();
                        bVal = b.createdBy.displayName.toLowerCase();
                        break;
                    case 'repository':
                        aVal = `${a._project}/${a._repo.name}`.toLowerCase();
                        bVal = `${b._project}/${b._repo.name}`.toLowerCase();
                        break;
                    case 'status':
                        aVal = a.status.toLowerCase();
                        bVal = b.status.toLowerCase();
                        break;
                    case 'created':
                        aVal = new Date(a.creationDate);
                        bVal = new Date(b.creationDate);
                        break;
                    default:
                        return 0;
                }

                if (aVal < bVal) return currentOrder === 'asc' ? -1 : 1;
                if (aVal > bVal) return currentOrder === 'asc' ? 1 : -1;
                return 0;
            });

            return sorted;
        }

        function displayPRs() {
            const resultsDiv = document.getElementById('results');
            const infoBar = document.getElementById('infoBar');
            const paginationBar = document.getElementById('paginationBar');

            if (allPRs.length === 0) {
                resultsDiv.innerHTML = '<div class="info">No Pull Requests loaded yet. Click "Select Repos" to get started.</div>';
                infoBar.innerHTML = '';
                paginationBar.innerHTML = '';
                return;
            }

            if (filteredPRs.length === 0) {
                resultsDiv.innerHTML = '<div class="warning">No Pull Requests match the current filters.</div>';
                infoBar.innerHTML = '';
                paginationBar.innerHTML = '';
                return;
            }

            const sortedPRs = getSortedPRs();

            // Pagination calculations
            const totalPRs = sortedPRs.length;
            const totalPages = Math.ceil(totalPRs / itemsPerPage);
            currentPage = PRListDisplay.clampPage(currentPage, totalPages);

            const { startIndex, endIndex } = PRListDisplay.getPageSlice(currentPage, itemsPerPage, totalPRs);
            const pagePRs = sortedPRs.slice(startIndex, endIndex);

            // Build columns visibility dropdown
            const columnsDropdownHtml = HIDEABLE_COLUMNS.map(c => `
                <label class="column-toggle-item">
                    <input type="checkbox" id="col-vis-${c}" ${columnVisibility[c] ? 'checked' : ''} onchange="toggleColumnVisibility('${c}')">
                    ${COLUMN_LABELS[c]}
                </label>
            `).join('');

            // Build info bar
            const infoBarHtml = PRListDisplay.buildInfoBarHtml({
                startIndex, endIndex, totalPRs,
                allPRsCount: allPRs.length, itemsPerPage, columnsDropdownHtml
            });

            // Helper to conditionally render column
            const col = (columnId, content) => columnVisibility[columnId] ? content : '';
            const colStyle = (columnId) => PRListDisplay.getColumnStyle(columnId, columnWidths);
            const sortInd = (column) => PRListDisplay.getSortIndicator(column, currentSort, currentOrder);

            // Build table
            let tableHtml = `
                <table class="pr-table" style="${PRListDisplay.calculateTableWidth(columnWidths, columnVisibility)}">
                    <thead>
                        <tr>
                            <th class="sortable" data-column="id" onclick="sortPRs('id')" style="${colStyle('id')}">ID${sortInd('id')}<div class="column-resize-handle" data-column="id"></div></th>
                            ${col('title', `<th class="sortable" data-column="title" onclick="sortPRs('title')" style="${colStyle('title')}">Title${sortInd('title')}<div class="column-resize-handle" data-column="title"></div></th>`)}
                            ${col('author', `<th class="sortable" data-column="author" onclick="sortPRs('author')" style="${colStyle('author')}">Author${sortInd('author')}<div class="column-resize-handle" data-column="author"></div></th>`)}
                            ${col('repository', `<th class="sortable" data-column="repository" onclick="sortPRs('repository')" style="${colStyle('repository')}">Repository${sortInd('repository')}<div class="column-resize-handle" data-column="repository"></div></th>`)}
                            ${col('reviewers', `<th data-column="reviewers" style="${colStyle('reviewers')}">Reviewers<div class="column-resize-handle" data-column="reviewers"></div></th>`)}
                            ${col('otherAuthors', `<th data-column="otherAuthors" style="${colStyle('otherAuthors')}">Other Authors<div class="column-resize-handle" data-column="otherAuthors"></div></th>`)}
                            ${col('status', `<th class="sortable" data-column="status" onclick="sortPRs('status')" style="${colStyle('status')}">Status${sortInd('status')}<div class="column-resize-handle" data-column="status"></div></th>`)}
                            ${col('updates', `<th data-column="updates" style="${colStyle('updates')} text-align: center;">🔄<div class="column-resize-handle" data-column="updates"></div></th>`)}
                            ${col('comments', `<th data-column="comments" style="${colStyle('comments')} text-align: center;">💬<div class="column-resize-handle" data-column="comments"></div></th>`)}
                            ${col('created', `<th class="sortable" data-column="created" onclick="sortPRs('created')" style="${colStyle('created')}">Created${sortInd('created')}<div class="column-resize-handle" data-column="created"></div></th>`)}
                        </tr>
                    </thead>
                    <tbody>
            `;

            pagePRs.forEach(pr => {
                const prThreadsUrl = `ado-pr-threads.html?prId=${pr.pullRequestId}&project=${encodeURIComponent(pr._project)}&repo=${encodeURIComponent(pr._repo.name)}`;
                const prKey = `${pr._project}/${pr._repo.id}/${pr.pullRequestId}`;

                const commentDisplay = PRListDisplay.buildCommentDisplay(prKey, prCommentCounts);
                const updatesDisplay = PRListDisplay.buildUpdatesDisplay(prKey, prIterationCounts);

                // Update LRU access time for comment cache
                if (prCommentCounts[prKey]?.lastAccess !== undefined) {
                    prCommentCounts[prKey].lastAccess = Date.now();
                }

                // Check if row should be grayed out
                const isGrayedOut = grayedOutPRKeys.has(prKey);
                const grayedOutClass = isGrayedOut ? ' grayed-out' : '';
                const filterIndicator = isGrayedOut ? '<span class="filter-indicator">(no longer matches filters)</span>' : '';

                tableHtml += `
                    <tr data-pr-key="${prKey}" class="${grayedOutClass}">
                        <td style="${colStyle('id')}">
                            <a href="${prThreadsUrl}"
                               target="_blank"
                               onclick="return openPRLink('${ADOContent.escapeHtml(pr._project)}', '${ADOContent.escapeHtml(pr._repo.name)}', ${pr.pullRequestId})"
                               style="color: inherit; text-decoration: none; display: block;">
                                <strong>#${pr.pullRequestId}</strong>
                            </a>
                        </td>
                        ${col('title', `<td style="${colStyle('title')}">
                            <a href="${prThreadsUrl}"
                               target="_blank"
                               onclick="return openPRLink('${ADOContent.escapeHtml(pr._project)}', '${ADOContent.escapeHtml(pr._repo.name)}', ${pr.pullRequestId})"
                               style="color: inherit; text-decoration: none; display: block;">
                                <div class="pr-title">${ADOContent.escapeHtml(pr.title)}${filterIndicator}</div>
                                <div class="branch-info"><code>${pr.sourceRefName?.replace('refs/heads/', '') || ''}</code> → <code>${pr.targetRefName?.replace('refs/heads/', '') || ''}</code></div>
                                <div class="pr-status-indicators">${generateStatusIndicatorsHtml(prKey)}</div>
                            </a>
                        </td>`)}
                        ${col('author', `<td class="pr-meta" style="${colStyle('author')}">${getAuthorAvatarHtml(pr.createdBy)}</td>`)}
                        ${col('repository', `<td class="pr-meta" style="${colStyle('repository')}">
                            ${ADOContent.escapeHtml(pr._project)}<br>
                            <span style="font-size: 12px; color: #8a8886;">${ADOContent.escapeHtml(pr._repo.name)}</span>
                        </td>`)}
                        ${col('reviewers', `<td class="pr-meta" style="${colStyle('reviewers')}">
                            ${getReviewerAvatarsHtml(pr.reviewers)}
                        </td>`)}
                        ${col('otherAuthors', `<td class="pr-meta pr-other-authors" style="${colStyle('otherAuthors')}">
                            <span style="color: #8a8886;">-</span>
                        </td>`)}
                        ${col('status', `<td style="${colStyle('status')}">${ADOUI.renderStatusBadge(pr.status, pr)}</td>`)}
                        ${col('updates', `<td class="pr-meta pr-updates" style="text-align: center; ${colStyle('updates')}">${updatesDisplay}</td>`)}
                        ${col('comments', `<td class="pr-meta pr-comments" style="text-align: center; ${colStyle('comments')}">${commentDisplay}</td>`)}
                        ${col('created', `<td class="pr-meta" style="${colStyle('created')}">${ADOUI.formatDate(pr.creationDate)}</td>`)}
                    </tr>
                `;
            });

            tableHtml += `
                    </tbody>
                </table>
            `;

            // Build pagination controls
            const paginationHtml = PRListDisplay.buildPaginationHtml(currentPage, totalPages);

            // Update DOM
            infoBar.innerHTML = infoBarHtml;
            resultsDiv.innerHTML = tableHtml;
            paginationBar.innerHTML = paginationHtml;

            // Load reviewer avatars via proxy
            AvatarLoader.loadPending();

            // Initialize column resize handles
            initColumnResize();

            // Restore dynamic badges from cached data (thread badges on avatars, other authors)
            restoreDynamicBadges();

            // Start fetching comment counts after rendering using priority queue
            processPriorityQueue();
        }

        function changePage(page) {
            // Clear grayed out PRs when page changes
            grayedOutPRKeys.clear();

            currentPage = page;
            updateURL();
            displayPRs();
            // Scroll to top of results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function changePerPage(perPage) {
            itemsPerPage = parseInt(perPage);
            currentPage = 1; // Reset to first page
            updateURL();
            displayPRs();
        }

        // fetchCommentCounts, priority queue, badge/indicator updates are in js/pr-list-fetch.js

        function openPRLink(project, repository, prId) {
            // Store current URL so we can return to it from PR threads
            sessionStorage.setItem('prListReturnUrl', window.location.href);

            // Return true to allow the link to work normally
            // This way left-click, right-click, and middle-click all work
            return true;
        }

        function showAutocomplete(type) {
            const input = document.getElementById(`${type}Filter`);
            const autocompleteDiv = document.getElementById(`${type}Autocomplete`);
            const fullValue = input.value;

            // Work with the segment after the last semicolon
            const segments = fullValue.split(';');
            const currentSegment = ADOSearch.normalize(segments[segments.length - 1].trim());

            if (currentSegment.length === 0) {
                autocompleteDiv.classList.remove('show');
                applyFilters();
                return;
            }

            // Get already-selected users to exclude from suggestions
            const alreadySelected = new Set(
                segments.slice(0, -1).map(s => ADOSearch.normalize(s.trim())).filter(s => s.length > 0)
            );

            const items = type === 'createdBy' ? Array.from(allAuthors)
                : type === 'assignedTo' ? Array.from(allReviewers)
                : type === 'involvedIn' ? Array.from(new Set([...allAuthors, ...allReviewers, ...allCommentAuthors]))
                : Array.from(allCommentAuthors);
            const filtered = items.filter(item =>
                ADOSearch.normalize(item).includes(currentSegment) &&
                !alreadySelected.has(ADOSearch.normalize(item))
            );

            if (filtered.length === 0) {
                autocompleteDiv.classList.remove('show');
                applyFilters();
                return;
            }

            let html = '';
            filtered.slice(0, 10).forEach(item => {
                html += `
                    <div class="autocomplete-item" onclick="selectAutocomplete('${type}', '${ADOContent.escapeJs(item)}')">
                        ${ADOContent.escapeHtml(item)}
                    </div>
                `;
            });

            autocompleteDiv.innerHTML = html;
            autocompleteDiv.classList.add('show');
            applyFilters();
        }

        function selectAutocomplete(type, value) {
            const input = document.getElementById(`${type}Filter`);
            const fullValue = input.value;
            const segments = fullValue.split(';');

            // Replace the current (last) segment with the selected value
            segments[segments.length - 1] = value;
            input.value = segments.join('; ');

            document.getElementById(`${type}Autocomplete`).classList.remove('show');
            applyFilters();
        }

        // Close autocomplete when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-container')) {
                document.querySelectorAll('.autocomplete-results').forEach(div => {
                    div.classList.remove('show');
                });
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('loadPRModal');
                if (modal.classList.contains('show')) {
                    closeLoadPRModal();
                }
            }
        });

        // Sidebar resize functionality
        (function initSidebarResize() {
            const resizeHandle = document.getElementById('resizeHandle');
            const sidebar = document.querySelector('.sidebar');
            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                const delta = e.clientX - startX;
                const newWidth = startWidth + delta;

                // Apply min/max constraints
                if (newWidth >= 200 && newWidth <= 600) {
                    sidebar.style.width = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        })();

        // Column resize, visibility, and dropdown functions are in js/pr-list-columns.js

        // visibilitychange listener for background polling is in js/pr-list-live-updates.js

        function clearFilters() {
            document.getElementById('prIdFilter').value = '';
            document.getElementById('titleFilter').value = '';
            document.getElementById('involvedInFilter').value = '';
            document.getElementById('createdByFilter').value = '';
            document.getElementById('assignedToFilter').value = '';
            document.getElementById('commentAuthorFilter').value = '';

            // Uncheck all status checkboxes (means "show all")
            ['active', 'completed', 'abandoned'].forEach(status => {
                const checkbox = document.querySelector(`input[type="checkbox"][value="${status}"]`);
                if (checkbox) {
                    checkbox.checked = false;
                }
            });

            applyFilters(); // This will call updateURL()
        }

        // Live update system functions are in js/pr-list-live-updates.js

        function getPRKey(pr) {
            return PRListUtils.getPRKey(pr);
        }

        function hasPRChanged(oldPR, freshPR) {
            return PRListUtils.hasPRChanged(oldPR, freshPR);
        }
    </script>
</body>
</html>
