<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     stroke="#0078d4" stroke-linecap="round" stroke-linejoin="round">

  <!-- Hind legs (behind body) -->
  <ellipse cx="17" cy="84" rx="16" ry="9" fill="white" stroke-width="4" transform="rotate(-18 17 84)"/>
  <ellipse cx="83" cy="84" rx="16" ry="9" fill="white" stroke-width="4" transform="rotate(18 83 84)"/>

  <!-- Main body -->
  <ellipse cx="50" cy="72" rx="37" ry="24" fill="white" stroke-width="4.5"/>

  <!-- Head -->
  <ellipse cx="50" cy="50" rx="33" ry="30" fill="white" stroke-width="4.5"/>

  <!-- Eye protrusion bumps -->
  <ellipse cx="24" cy="37" rx="17" ry="14" fill="white" stroke-width="4"/>
  <ellipse cx="76" cy="37" rx="17" ry="14" fill="white" stroke-width="4"/>

  <!-- Iris rings -->
  <circle cx="24" cy="37" r="10" fill="white" stroke-width="3"/>
  <circle cx="76" cy="37" r="10" fill="white" stroke-width="3"/>

  <!-- Pupils — horizontal oval, the key toad feature -->
  <ellipse cx="24" cy="37" rx="6.5" ry="4.5" fill="#0078d4" stroke="none"/>
  <ellipse cx="76" cy="37" rx="6.5" ry="4.5" fill="#0078d4" stroke="none"/>

  <!-- Eye shines -->
  <circle cx="20" cy="33" r="2" fill="white" stroke="none"/>
  <circle cx="72" cy="33" r="2" fill="white" stroke="none"/>

  <!-- Nostrils -->
  <circle cx="44" cy="54" r="2" fill="#0078d4" stroke="none"/>
  <circle cx="56" cy="54" r="2" fill="#0078d4" stroke="none"/>

  <!-- Mouth — wide toad smile -->
  <path d="M 35 62 Q 50 72 65 62" fill="none" stroke-width="3.5"/>

  <!-- Front arms -->
  <ellipse cx="16" cy="79" rx="9" ry="5" fill="white" stroke-width="4" transform="rotate(-25 16 79)"/>
  <ellipse cx="84" cy="79" rx="9" ry="5" fill="white" stroke-width="4" transform="rotate(25 84 79)"/>

  <!-- Front toes — left -->
  <circle cx="4"  cy="83" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="8"  cy="87" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="13" cy="90" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="19" cy="90" r="3"   fill="white" stroke-width="3.5"/>

  <!-- Front toes — right -->
  <circle cx="96" cy="83" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="92" cy="87" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="87" cy="90" r="3.5" fill="white" stroke-width="3.5"/>
  <circle cx="81" cy="90" r="3"   fill="white" stroke-width="3.5"/>
</svg>
